name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.6)'
        required: true
        type: string

env:
  DOCKER_IMAGE_PREFIX: ${{ secrets.DOCKER_HUB_USERNAME }}/bnoa

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ============================================
      # 构建后端镜像
      # ============================================
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_PREFIX }}-backend:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ============================================
      # 构建前端镜像
      # ============================================
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/my-app
          file: ./frontend/my-app/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_IMAGE_PREFIX }}-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ============================================
      # 创建 GitHub Release
      # ============================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## BNOA ${{ github.ref_name }}

            ### Docker 镜像

            | 服务 | 镜像 |
            |------|------|
            | 后端 | `${{ env.DOCKER_IMAGE_PREFIX }}-backend:${{ steps.version.outputs.VERSION }}` |
            | 前端 | `${{ env.DOCKER_IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.VERSION }}` |

            ### 升级方式

            **方式一：后台一键升级（推荐）**
            1. 登录系统后台
            2. 进入 **系统设置 → 系统升级**
            3. 点击 **检查更新** → **开始升级**

            **方式二：手动升级**
            1. 更新 `docker-compose.prod.yml` 中的镜像版本号为 `${{ steps.version.outputs.VERSION }}`
            2. 执行 `docker compose -f docker-compose.prod.yml pull`
            3. 执行 `docker compose -f docker-compose.prod.yml up -d`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
